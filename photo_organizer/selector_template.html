<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>照片挑選 — Phase 2</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f232b; --card: #262b34; --text: #e6e8ec;
    --dim: #8a919e; --accent: #4da3ff; --keep: #38c172; --reject: #e3524f;
    --star: #f2c94c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 20; background: var(--panel);
           padding: 10px 16px; display: flex; align-items: center; gap: 16px;
           border-bottom: 1px solid #000; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  #counts { color: var(--dim); }
  #counts b.k { color: var(--keep); } #counts b.r { color: var(--reject); }
  #counts b.u { color: var(--accent); }
  button { background: #333a46; color: var(--text); border: 1px solid #4a5261;
           border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3e4653; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  #help { color: var(--dim); font-size: 12px; width: 100%; }
  kbd { background: #333a46; border-radius: 3px; padding: 0 5px; font-family: inherit; }

  .scene { margin: 18px 16px; }
  .scene-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .scene-head h2 { font-size: 15px; margin: 0; color: var(--accent); cursor: text; }
  .scene-head h2 input { font: inherit; background: var(--card); color: var(--text);
                         border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; }
  .scene-meta { color: var(--dim); font-size: 12px; }
  .scene-head button { font-size: 12px; padding: 2px 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }

  .card { width: 176px; background: var(--card); border-radius: 8px; overflow: hidden;
          border: 2px solid transparent; cursor: pointer; position: relative; }
  .card img { width: 100%; height: 118px; object-fit: cover; display: block; pointer-events: none; }
  .card .meta { padding: 4px 6px; font-size: 11px; color: var(--dim);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .badges { position: absolute; top: 4px; left: 4px; right: 4px;
                  display: flex; justify-content: space-between; font-size: 12px;
                  text-shadow: 0 1px 2px #000; pointer-events: none; }
  .card .stars { color: var(--star); }
  .card.keep { border-color: var(--keep); }
  .card.reject { border-color: var(--reject); opacity: .38; }
  .card.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
  .card.drag-over-before { box-shadow: -4px 0 0 0 var(--accent); }
  .card.drag-over-after  { box-shadow:  4px 0 0 0 var(--accent); }
  .card .state-tag { position: absolute; bottom: 24px; right: 4px; font-size: 11px;
                     padding: 0 6px; border-radius: 4px; color: #fff; pointer-events: none; }
  .card.keep .state-tag { background: var(--keep); }
  .card.reject .state-tag { background: var(--reject); }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50;
              display: none; flex-direction: column; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 88vh; object-fit: contain; }
  #lb-caption { color: var(--dim); margin-top: 8px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--accent); color: #08131f; padding: 8px 18px; border-radius: 8px;
           font-weight: 600; opacity: 0; transition: opacity .3s; z-index: 60; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>照片挑選</h1>
  <span id="counts"></span>
  <button id="btn-export" class="primary">匯出 decisions.json</button>
  <button id="btn-reset">清除本機進度</button>
  <div id="help">
    快捷鍵:<kbd>←</kbd><kbd>→</kbd> 移動選取 ·
    <kbd>K</kbd>/<kbd>Space</kbd> 保留 · <kbd>X</kbd> 刪除 · <kbd>U</kbd> 未定 ·
    <kbd>1</kbd>–<kbd>5</kbd> 星等 · <kbd>0</kbd> 清除星等 ·
    <kbd>Enter</kbd> 放大檢視 · <kbd>Esc</kbd> 關閉 ·
    雙擊場景標題可重新命名 · 拖曳縮圖可調整場景內順序
  </div>
</header>
<div id="scenes"></div>
<div id="lightbox"><img id="lb-img" alt=""><div id="lb-caption"></div></div>
<div id="toast"></div>

<script src="manifest.js"></script>
<script>
(function () {
  'use strict';
  const M = window.PHOTO_MANIFEST;
  if (!M) { document.body.textContent = '找不到 manifest.js,請先執行 phase1_prepare.py build'; return; }
  const STORE_KEY = 'photoSel:' + M.generated_at + ':' + M.photos.length;

  // ---- 狀態 ----------------------------------------------------------
  // scenes: [{key, name}](順序即顯示順序)
  // ph[id]: {scene, order, keep:'u'|'k'|'r', stars}
  let scenes, ph;
  const byId = {};
  M.photos.forEach(p => { byId[p.id] = p; });

  function freshState() {
    scenes = M.scenes.map(s => ({ key: s.key, name: s.name }));
    ph = {};
    M.photos.forEach(p => { ph[p.id] = { scene: p.scene, order: p.order, keep: 'u', stars: 0 }; });
  }
  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify({ scenes, ph }));
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY));
      if (d && d.scenes && d.ph && Object.keys(d.ph).length === M.photos.length) {
        scenes = d.scenes; ph = d.ph; return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  }
  freshState();
  if (load()) toast('已還原上次進度(存於瀏覽器本機)');

  let selectedId = M.photos.length ? M.photos[0].id : null;

  function scenePhotos(key) {
    return Object.keys(ph).filter(id => ph[id].scene === key)
      .sort((a, b) => ph[a].order - ph[b].order || a.localeCompare(b));
  }
  function flatIds() {
    return scenes.flatMap(s => scenePhotos(s.key));
  }
  function fmtTime(iso) { return iso.replace('T', ' '); }
  function fmtRange(ids) {
    if (!ids.length) return '';
    return fmtTime(byId[ids[0]].taken).slice(0, 16) + ' ~ ' +
           fmtTime(byId[ids[ids.length - 1]].taken).slice(11, 16);
  }

  // ---- 畫面 ----------------------------------------------------------
  const $scenes = document.getElementById('scenes');

  function render() {
    $scenes.textContent = '';
    scenes.forEach((s, si) => {
      const ids = scenePhotos(s.key);
      const sec = document.createElement('section');
      sec.className = 'scene'; sec.dataset.scene = s.key;

      const head = document.createElement('div');
      head.className = 'scene-head';
      const h2 = document.createElement('h2');
      h2.textContent = s.name;
      h2.title = '雙擊重新命名';
      h2.addEventListener('dblclick', () => renameScene(s.key, h2));
      head.appendChild(h2);
      const meta = document.createElement('span');
      meta.className = 'scene-meta';
      const kept = ids.filter(id => ph[id].keep === 'k').length;
      const rej = ids.filter(id => ph[id].keep === 'r').length;
      meta.textContent = `${ids.length} 張(保留 ${kept} / 刪除 ${rej}) ${fmtRange(ids)}`;
      head.appendChild(meta);
      if (si > 0) {
        const btn = document.createElement('button');
        btn.textContent = '⇧ 併入上一場景';
        btn.addEventListener('click', () => mergeScene(si));
        head.appendChild(btn);
      }
      sec.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'grid'; grid.dataset.scene = s.key;
      ids.forEach(id => grid.appendChild(makeCard(id)));
      sec.appendChild(grid);
      $scenes.appendChild(sec);
    });
    updateCounts();
  }

  function makeCard(id) {
    const p = byId[id], st = ph[id];
    const card = document.createElement('div');
    card.className = 'card' + (st.keep === 'k' ? ' keep' : st.keep === 'r' ? ' reject' : '') +
                     (id === selectedId ? ' selected' : '');
    card.dataset.id = id;
    card.draggable = true;

    const img = document.createElement('img');
    img.loading = 'lazy'; img.src = p.thumb; img.alt = p.name;
    card.appendChild(img);

    const badges = document.createElement('div');
    badges.className = 'badges';
    const src = document.createElement('span');
    src.textContent = p.source === 'iphone' ? '📱' : '📷';
    const stars = document.createElement('span');
    stars.className = 'stars';
    stars.textContent = '★'.repeat(st.stars);
    badges.appendChild(src); badges.appendChild(stars);
    card.appendChild(badges);

    if (st.keep !== 'u') {
      const tag = document.createElement('span');
      tag.className = 'state-tag';
      tag.textContent = st.keep === 'k' ? '保留' : '刪除';
      card.appendChild(tag);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = p.name + ' · ' + fmtTime(p.taken).slice(11);
    card.appendChild(meta);

    card.addEventListener('click', () => { selectedId = id; render(); });
    card.addEventListener('dblclick', () => { selectedId = id; openLightbox(); });
    card.addEventListener('dragstart', ev => {
      dragId = id;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', id);
    });
    card.addEventListener('dragover', ev => {
      if (!dragId || dragId === id || ph[dragId].scene !== ph[id].scene) return;
      ev.preventDefault();
      const r = card.getBoundingClientRect();
      const before = ev.clientX < r.left + r.width / 2;
      card.classList.toggle('drag-over-before', before);
      card.classList.toggle('drag-over-after', !before);
    });
    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over-before', 'drag-over-after');
    });
    card.addEventListener('drop', ev => {
      ev.preventDefault();
      const before = card.classList.contains('drag-over-before');
      card.classList.remove('drag-over-before', 'drag-over-after');
      if (!dragId || dragId === id || ph[dragId].scene !== ph[id].scene) return;
      reorder(dragId, id, before);
      dragId = null;
    });
    card.addEventListener('dragend', () => { dragId = null; });
    return card;
  }

  let dragId = null;
  function reorder(movedId, targetId, before) {
    const key = ph[movedId].scene;
    const ids = scenePhotos(key).filter(x => x !== movedId);
    let idx = ids.indexOf(targetId);
    if (!before) idx += 1;
    ids.splice(idx, 0, movedId);
    ids.forEach((x, i) => { ph[x].order = i; });
    selectedId = movedId;
    save(); render();
  }

  function renameScene(key, h2) {
    const s = scenes.find(x => x.key === key);
    const input = document.createElement('input');
    input.value = s.name;
    h2.textContent = ''; h2.appendChild(input);
    input.focus(); input.select();
    const done = commit => {
      if (commit && input.value.trim()) s.name = input.value.trim();
      save(); render();
    };
    input.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') done(true);
      if (ev.key === 'Escape') done(false);
    });
    input.addEventListener('blur', () => done(true));
  }

  function mergeScene(si) {
    const from = scenes[si], into = scenes[si - 1];
    const base = scenePhotos(into.key).length;
    scenePhotos(from.key).forEach((id, i) => {
      ph[id].scene = into.key; ph[id].order = base + i;
    });
    scenes.splice(si, 1);
    save(); render();
    toast(`已把「${from.name}」併入「${into.name}」`);
  }

  function updateCounts() {
    const all = Object.values(ph);
    const k = all.filter(s => s.keep === 'k').length;
    const r = all.filter(s => s.keep === 'r').length;
    const u = all.length - k - r;
    document.getElementById('counts').innerHTML =
      `共 ${all.length} 張 · <b class="k">保留 ${k}</b> · <b class="r">刪除 ${r}</b> · <b class="u">未定 ${u}</b>`;
  }

  // ---- 快捷鍵 --------------------------------------------------------
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT') return;
    const lb = document.getElementById('lightbox').classList.contains('open');
    const flat = flatIds();
    const pos = flat.indexOf(selectedId);
    const nav = d => {
      const np = Math.min(flat.length - 1, Math.max(0, pos + d));
      selectedId = flat[np]; render();
      if (lb) updateLightbox();
      const el = document.querySelector(`.card[data-id="${selectedId}"]`);
      if (el && !lb) el.scrollIntoView({ block: 'nearest' });
    };
    const setKeep = v => {
      if (!selectedId) return;
      ph[selectedId].keep = ph[selectedId].keep === v ? 'u' : v;
      save(); render(); if (lb) updateLightbox();
    };
    switch (ev.key) {
      case 'ArrowRight': ev.preventDefault(); nav(1); break;
      case 'ArrowLeft': ev.preventDefault(); nav(-1); break;
      case ' ': ev.preventDefault(); setKeep('k'); break;
      case 'k': case 'K': setKeep('k'); break;
      case 'x': case 'X': case 'd': case 'D': setKeep('r'); break;
      case 'u': case 'U': setKeep('u'); break;
      case 'Enter':
        if (lb) closeLightbox(); else openLightbox();
        break;
      case 'Escape': closeLightbox(); break;
      default:
        if (/^[0-5]$/.test(ev.key) && selectedId) {
          ph[selectedId].stars = +ev.key;
          save(); render(); if (lb) updateLightbox();
        }
    }
  });

  // ---- 放大檢視 ------------------------------------------------------
  const $lb = document.getElementById('lightbox');
  function openLightbox() { if (selectedId) { $lb.classList.add('open'); updateLightbox(); } }
  function closeLightbox() { $lb.classList.remove('open'); }
  function updateLightbox() {
    const p = byId[selectedId], st = ph[selectedId];
    document.getElementById('lb-img').src = p.display;
    document.getElementById('lb-caption').textContent =
      `${p.name} · ${fmtTime(p.taken)} · ${p.source === 'iphone' ? 'iPhone' : '相機'} · ` +
      (st.keep === 'k' ? '保留' : st.keep === 'r' ? '刪除' : '未定') +
      (st.stars ? ' · ' + '★'.repeat(st.stars) : '');
  }
  $lb.addEventListener('click', ev => { if (ev.target === $lb) closeLightbox(); });

  // ---- 匯出 ----------------------------------------------------------
  document.getElementById('btn-export').addEventListener('click', () => {
    const u = Object.values(ph).filter(s => s.keep === 'u').length;
    if (u > 0 && !confirm(`還有 ${u} 張「未定」照片。仍要匯出嗎?\n(未定照片在 Phase 3 預設不會被搬動,會列在報告中)`)) return;
    const out = {
      version: 1,
      exported_at: new Date().toISOString(),
      manifest_generated_at: M.generated_at,
      scenes: scenes.map((s, i) => ({ key: s.key, name: s.name, order: i })),
      photos: flatIds().map(id => {
        const p = byId[id], st = ph[id];
        return {
          id, orig_path: p.orig_path, raw_paths: p.raw_paths, source: p.source,
          name: p.name, taken: p.taken, scene: st.scene, order: st.order,
          keep: st.keep === 'k' ? true : st.keep === 'r' ? false : null,
          stars: st.stars,
        };
      }),
    };
    const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'decisions.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已匯出 decisions.json,請存到工作目錄後執行 Phase 3');
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('確定清除瀏覽器中儲存的挑選進度?(不影響照片檔案)')) return;
    localStorage.removeItem(STORE_KEY);
    freshState(); selectedId = M.photos.length ? M.photos[0].id : null;
    render();
  });

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  render();
})();
</script>
</body>
</html>
